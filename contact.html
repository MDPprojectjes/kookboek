<body>
  <!-- 🍓 Navigation -->

    <ul class="nav-bar-content">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#recipes">Recipes</a></li>
      <li><a href="index.html#about">About</a></li>

  <!-- 🚫 CONTACTEER MIJ NIET -->
  <section class="no-contact">
    <h1>CONTACTEER MIJ NIET</h1>
    <img src="images/bunny.gif" alt="boze bunny" class="bunny-gif" />
    <p>🧁 Bedankt voor je interesse, maar ik ben druk bezig met koekjes bakken 🍪</p>
    <form class="fake-form">
        <textarea placeholder="Typ hier je boodschap (die ik ga negeren) 🙃"></textarea>
        <button id="escape-button">Verzend</button>
      </form>
    </section>
  </section>
  <script>
    const btn = document.getElementById('escape-button');

    btn.addEventListener('mouseover', () => {
      const maxX = window.innerWidth - btn.offsetWidth;
      const maxY = window.innerHeight - btn.offsetHeight;
      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      btn.style.position = 'absolute';
      btn.style.left = randomX + 'px';
      btn.style.top = randomY + 'px';
    });
  </script>
</body>
